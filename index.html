<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Home Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --badge-red: #ef4444;
      --badge-green: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 1.5rem 2rem;
      border-radius: 1.2rem;
    }
    .time-box h1 { font-size: 3.5rem; font-weight: 800; letter-spacing: -1px; }
    .time-box p { font-size: 1.2rem; color: var(--text-muted); }
    .weather-box { text-align: right; }
    .weather-temp { font-size: 2.8rem; font-weight: 700; color: var(--accent); }
    .weather-info { font-size: 1rem; color: var(--text-muted); }

    .main-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 1.5rem;
      flex: 1;
    }
    @media (max-width: 768px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border-radius: 1.2rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
    }
    .card h2 {
      font-size: 1.3rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .last-update { font-size: 0.8rem; color: var(--text-muted); font-weight: normal; }

    /* Bus List */
    .bus-group { margin-bottom: 1.2rem; }
    .bus-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 0.4rem; color: #fbbf24; }
    .eta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0;
      border-bottom: 1px dashed #334155;
    }
    .eta-seq { color: var(--text-muted); }
    .eta-time { font-weight: 600; }
    .eta-countdown {
      background: #334155;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.85rem;
    }
    .eta-urgent { background: var(--badge-green); color: black; font-weight: bold; }

    /* Reminders */
    .reminder-input { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .reminder-input input {
      flex: 1;
      padding: 0.6rem 0.8rem;
      border-radius: 0.5rem;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
    }
    .reminder-input button {
      padding: 0.6rem 1rem;
      background: var(--accent);
      border: none;
      border-radius: 0.5rem;
      font-weight: bold;
      cursor: pointer;
    }
    .reminder-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
    .reminder-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 0.6rem 0.8rem;
      border-radius: 0.5rem;
    }
    .reminder-item button {
      background: transparent;
      border: none;
      color: var(--badge-red);
      font-size: 1.1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 頂部：時鐘、日期、即時天氣 -->
  <div class="top-bar">
    <div class="time-box">
      <h1 id="clock">--:--</h1>
      <p id="date">載入中...</p>
    </div>
    <div class="weather-box">
      <div class="weather-temp" id="temp">--°C</div>
      <div class="weather-info" id="weather-desc">相對濕度: --%</div>
    </div>
  </div>

  <div class="main-grid">
    <!-- 巴士實時到站時間 -->
    <div class="card">
      <h2>
        🚌 巴士預計到站
        <span class="last-update" id="eta-updated">更新中...</span>
      </h2>
      <div id="bus-container">載入中...</div>
    </div>

    <!-- 備忘錄 / Reminders -->
    <div class="card">
      <h2>📝 家居備忘</h2>
      <div class="reminder-input">
        <input type="text" id="rem-input" placeholder="新增備忘項目..." onkeypress="handleEnter(event)">
        <button onclick="addReminder()">新增</button>
      </div>
      <ul class="reminder-list" id="rem-list"></ul>
    </div>
  </div>

  <script>
    /* ================= 1. 巴士設定 (請填入屋企附近站點的 stop_id) ================= */
    // stop_id 可以透過九巴 API 或者下文查到
    const BUS_TRACK_LIST = [
      {
        route: "93A",
        dest: "寶林 往 觀塘碼頭",
        stop_id: "22E2678081E88368", // 範例站點 ID (請替換為你的站點)
        service_type: "1"
      },
      {
        route: "297",
        dest: "寶林 往 紅磡",
        stop_id: "22E2678081E88368", // 範例站點 ID (請替換為你的站點)
        service_type: "1"
      }
    ];

    /* ================= 2. 時間與日期 ================= */
    function updateClock() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').innerText = `${hh}:${mm}`;

      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      document.getElementById('date').innerText = now.toLocaleDateString('zh-HK', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    /* ================= 3. 天文台即時天氣 ================= */
    async function fetchWeather() {
      try {
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const data = await res.json();
        if (data.temperature && data.temperature.data.length > 0) {
          // 預設取香港天文台站或區域氣溫
          const temp = data.temperature.data[0].value;
          const humidity = data.humidity.data[0].value;
          document.getElementById('temp').innerText = `${temp}°C`;
          document.getElementById('weather-desc').innerText = `濕度: ${humidity}% | 天文台`;
        }
      } catch (err) {
        console.error("天氣更新失敗:", err);
      }
    }
    fetchWeather();
    setInterval(fetchWeather, 5 * 60 * 1000); // 每 5 分鐘更新一次天氣

/* ================= 4. 九巴實時到站時間 (每秒即時倒數版) ================= */
    let latestBusData = []; // 儲存最新拉返嚟嘅巴士資料

    // A. 背景每 15 秒向九巴攞一次最新數據 (加入 timestamp 防止 iPad Safari 快取)
    async function fetchBusETA() {
      const tempResults = [];

      for (const item of BUS_TRACK_LIST) {
        try {
          // 加上 ?t=... 強制 Safari 唔好用舊 Cache
          const url = `https://data.etabus.gov.hk/v1/transport/kmb/eta/${item.stop_id}/${item.route}/${item.service_type}?t=${Date.now()}`;
          const res = await fetch(url, { cache: "no-store" });
          const json = await res.json();

          // 只保留有實際預計時間嘅頭 3 班車
          const etas = (json.data || [])
            .filter(e => e.eta)
            .slice(0, 3);

          tempResults.push({
            ...item,
            etas: etas,
            error: false
          });
        } catch (err) {
          console.error(`獲取 ${item.route} 失敗:`, err);
          tempResults.push({ ...item, etas: [], error: true });
        }
      }

      latestBusData = tempResults;
      document.getElementById('eta-updated').innerText = `API 同步: ${new Date().toLocaleTimeString('zh-HK', { hour12: false })}`;
      renderBusETA(); // 攞完數據即刻畫一次畫面
    }

    // B. 每 1 秒鐘更新一次畫面上面嘅「分：秒」倒數
    function renderBusETA() {
      const container = document.getElementById('bus-container');
      if (latestBusData.length === 0) return;

      const now = new Date();
      let html = '';

      for (const item of latestBusData) {
        html += `
          <div class="bus-group">
            <div class="bus-title">${item.route} <span style="font-size:0.9rem; color:#94a3b8;">(${item.dest})</span></div>
        `;

        if (item.error) {
          html += `<div style="color:#ef4444; font-size:0.9rem;">連線失敗，重試中...</div>`;
        } else if (item.etas.length === 0) {
          html += `<div style="color:#64748b; font-size:0.9rem;">未有實時班次 / 已過尾班車</div>`;
        } else {
          item.etas.forEach((e, idx) => {
            const etaDate = new Date(e.eta);
            const diffSec = Math.floor((etaDate - now) / 1000); // 計算相差幾多秒
            const etaTimeStr = etaDate.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });

            let countdownText = '';
            let isUrgent = false;

            if (diffSec <= 0) {
              countdownText = '即將抵達 / 已到站';
              isUrgent = true;
            } else {
              const mins = Math.floor(diffSec / 60);
              const secs = String(diffSec % 60).padStart(2, '0');
              countdownText = `${mins}分 ${secs}秒`;
              if (mins < 5) isUrgent = true; // 少過 5 分鐘轉綠色醒目提示
            }

            html += `
              <div class="eta-row">
                <span class="eta-seq">第 ${idx + 1} 班 (${etaTimeStr})</span>
                <span class="eta-countdown ${isUrgent ? 'eta-urgent' : ''}">
                  ${countdownText}
                </span>
              </div>
            `;
          });
        }
        html += `</div>`;
      }

      container.innerHTML = html;
    }

    // 啟動執行
    fetchBusETA();
    setInterval(fetchBusETA, 15 * 1000); // 每 15 秒向九巴伺服器同步一次
    setInterval(renderBusETA, 1000);     // 每 1 秒鐘即時跳動畫面倒數

    /* ================= 5. 家居備忘 (Local Storage) ================= */
    function loadReminders() {
      const list = JSON.parse(localStorage.getItem('home_reminders') || '[]');
      const ul = document.getElementById('rem-list');
      ul.innerHTML = '';
      list.forEach((item, index) => {
        ul.innerHTML += `
          <li class="reminder-item">
            <span>${item}</span>
            <button onclick="removeReminder(${index})">✕</button>
          </li>
        `;
      });
    }

    function addReminder() {
      const input = document.getElementById('rem-input');
      const val = input.value.trim();
      if (!val) return;
      const list = JSON.parse(localStorage.getItem('home_reminders') || '[]');
      list.push(val);
      localStorage.setItem('home_reminders', JSON.stringify(list));
      input.value = '';
      loadReminders();
    }

    function removeReminder(idx) {
      const list = JSON.parse(localStorage.getItem('home_reminders') || '[]');
      list.splice(idx, 1);
      localStorage.setItem('home_reminders', JSON.stringify(list));
      loadReminders();
    }

    function handleEnter(e) {
      if (e.key === 'Enter') addReminder();
    }

    loadReminders();
  </script>
</body>
</html>
