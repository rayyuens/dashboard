<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Home Dashboard</title>

  <!-- 引入 Firebase App & Realtime Database SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --badge-red: #ef4444;
      --badge-green: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 1.5rem 2rem;
      border-radius: 1.2rem;
    }
    .time-box h1 { font-size: 3.5rem; font-weight: 800; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
    .time-box p { font-size: 1.2rem; color: var(--text-muted); }
    .weather-box { text-align: right; }
    .weather-temp { font-size: 2.8rem; font-weight: 700; color: var(--accent); }
    .weather-info { font-size: 1rem; color: var(--text-muted); }

    .main-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 1.5rem;
      flex: 1;
    }
    @media (max-width: 768px) {
      .main-grid { grid-template-columns: 1fr; }
      .time-box h1 { font-size: 2.5rem; }
      .weather-temp { font-size: 2rem; }
    }

    .card {
      background: var(--card-bg);
      border-radius: 1.2rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
    }
    .card h2 {
      font-size: 1.3rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .last-update { font-size: 0.8rem; color: var(--text-muted); font-weight: normal; }

    /* Bus List */
    .bus-group { margin-bottom: 1.2rem; }
    .bus-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 0.4rem; color: #fbbf24; }
    .eta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0;
      border-bottom: 1px dashed #334155;
      font-variant-numeric: tabular-nums;
    }
    .eta-seq { color: var(--text-muted); }
    .eta-countdown {
      background: #334155;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      font-size: 0.9rem;
    }
    .eta-urgent { background: var(--badge-green); color: black; font-weight: bold; }

    /* Reminders */
    .reminder-input { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .reminder-input input {
      flex: 1;
      padding: 0.6rem 0.8rem;
      border-radius: 0.5rem;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 1rem;
    }
    .reminder-input button {
      padding: 0.6rem 1rem;
      background: var(--accent);
      border: none;
      border-radius: 0.5rem;
      font-weight: bold;
      cursor: pointer;
    }
    .reminder-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
    .reminder-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 0.7rem 0.9rem;
      border-radius: 0.5rem;
    }
    .reminder-item button {
      background: transparent;
      border: none;
      color: var(--badge-red);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0 0.4rem;
    }
  </style>
</head>
<body>

  <!-- 頂部：時鐘、日期、即時天氣 -->
  <div class="top-bar">
    <div class="time-box">
      <h1 id="clock">--:--:--</h1>
      <p id="date">載入中...</p>
    </div>
    <div class="weather-box">
      <div class="weather-temp" id="temp">--°C</div>
      <div class="weather-info" id="weather-desc">相對濕度: --%</div>
    </div>
  </div>

  <div class="main-grid">
    <!-- 巴士實時到站時間 -->
    <div class="card">
      <h2>
        🚌 景林邨 巴士預計到站
        <span class="last-update" id="eta-updated">更新中...</span>
      </h2>
      <div id="bus-container">載入中...</div>
    </div>

    <!-- 備忘錄 / Reminders -->
    <div class="card">
      <h2>
        📝 家居雲端備忘
        <span class="last-update" id="db-status">連線中...</span>
      </h2>
      <div class="reminder-input">
        <input type="text" id="rem-input" placeholder="新增備忘項目..." onkeypress="handleEnter(event)">
        <button onclick="addReminder()">新增</button>
      </div>
      <ul class="reminder-list" id="rem-list"></ul>
    </div>
  </div>

  <script>
    /* ================= 1. 巴士設定 (景林邨 TK206) ================= */
    const BUS_TRACK_LIST = [
      {
        route: "297",
        dest: "景林邨 往 紅磡(紅鸞道)",
        stop_id: "22E2678081E88368",
        service_type: "1"
      },
      {
        route: "93A",
        dest: "景林邨 往 觀塘碼頭",
        stop_id: "22E2678081E88368",
        service_type: "1"
      }
    ];

    /* ================= 2. 時間與日期 (連秒數) ================= */
    function updateClock() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').innerText = `${hh}:${mm}:${ss}`;

      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      document.getElementById('date').innerText = now.toLocaleDateString('zh-HK', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    /* ================= 3. 天文台即時天氣 (優先讀取將軍澳站) ================= */
    async function fetchWeather() {
      try {
        const res = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc&t=${Date.now()}`);
        const data = await res.json();
        if (data.temperature && data.temperature.data.length > 0) {
          // 優先尋找「將軍澳」分區氣溫，若無則用第一個站點
          const tkoStation = data.temperature.data.find(d => d.place === '將軍澳') || data.temperature.data[0];
          const humidity = data.humidity.data[0].value;
          document.getElementById('temp').innerText = `${tkoStation.value}°C`;
          document.getElementById('weather-desc').innerText = `${tkoStation.place} | 濕度: ${humidity}%`;
        }
      } catch (err) {
        console.error("天氣更新失敗:", err);
      }
    }
    fetchWeather();
    setInterval(fetchWeather, 5 * 60 * 1000); // 每 5 分鐘更新天氣

    /* ================= 4. 九巴實時到站時間 (每秒即時倒數版) ================= */
    let latestBusData = [];

    async function fetchBusETA() {
      const tempResults = [];

      for (const item of BUS_TRACK_LIST) {
        try {
          const url = `https://data.etabus.gov.hk/v1/transport/kmb/eta/${item.stop_id}/${item.route}/${item.service_type}?t=${Date.now()}`;
          const res = await fetch(url, { cache: "no-store" });
          const json = await res.json();

          // 只過濾出往該方向 (O = Outbound) 且有預計時間嘅頭 3 班車
          const etas = (json.data || [])
            .filter(e => e.eta && (!e.dir || e.dir === 'O'))
            .slice(0, 3);

          tempResults.push({ ...item, etas: etas, error: false });
        } catch (err) {
          console.error(`獲取 ${item.route} 失敗:`, err);
          tempResults.push({ ...item, etas: [], error: true });
        }
      }

      latestBusData = tempResults;
      document.getElementById('eta-updated').innerText = `API 同步: ${new Date().toLocaleTimeString('zh-HK', { hour12: false })}`;
      renderBusETA();
    }

    function renderBusETA() {
      const container = document.getElementById('bus-container');
      if (latestBusData.length === 0) return;

      const now = new Date();
      let html = '';

      for (const item of latestBusData) {
        html += `
          <div class="bus-group">
            <div class="bus-title">${item.route} <span style="font-size:0.9rem; color:#94a3b8;">(${item.dest})</span></div>
        `;

        if (item.error) {
          html += `<div style="color:#ef4444; font-size:0.9rem;">連線失敗，重試中...</div>`;
        } else if (item.etas.length === 0) {
          html += `<div style="color:#64748b; font-size:0.9rem;">未有實時班次 / 已過尾班車</div>`;
        } else {
          item.etas.forEach((e, idx) => {
            const etaDate = new Date(e.eta);
            const diffSec = Math.floor((etaDate - now) / 1000);
            const etaTimeStr = etaDate.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });

            let countdownText = '';
            let isUrgent = false;

            if (diffSec <= 0) {
              countdownText = '即將抵達 / 已到站';
              isUrgent = true;
            } else {
              const mins = Math.floor(diffSec / 60);
              const secs = String(diffSec % 60).padStart(2, '0');
              countdownText = `${mins}分 ${secs}秒`;
              if (mins < 5) isUrgent = true;
            }

            html += `
              <div class="eta-row">
                <span class="eta-seq">第 ${idx + 1} 班 (${etaTimeStr})</span>
                <span class="eta-countdown ${isUrgent ? 'eta-urgent' : ''}">
                  ${countdownText}
                </span>
              </div>
            `;
          });
        }
        html += `</div>`;
      }

      container.innerHTML = html;
    }

    fetchBusETA();
    setInterval(fetchBusETA, 15 * 1000); // 每 15 秒向九巴攞一次新資料
    setInterval(renderBusETA, 1000);     // 每 1 秒更新畫面倒數

    /* ================= 5. 家居備忘 (Firebase 即時雲端同步) ================= */
    const firebaseConfig = {
          apiKey: "AIzaSyBUHonT_ucWcc3Ks4vprZTZV3ji80CVwD4",
          authDomain: "my-home-dashboard-5f8ee.firebaseapp.com",
          databaseURL: "https://my-home-dashboard-5f8ee-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "my-home-dashboard-5f8ee",
          storageBucket: "my-home-dashboard-5f8ee.firebasestorage.app",
          messagingSenderId: "508816607799",
          appId: "1:508816607799:web:c2d1c8f646f973cfd00db2"
        };

    try {
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      const remindersRef = db.ref('reminders');

      remindersRef.on('value', (snapshot) => {
        document.getElementById('db-status').innerText = '🟢 已同步';
        const data = snapshot.val();
        const ul = document.getElementById('rem-list');
        ul.innerHTML = '';

        if (!data) return;

        Object.keys(data).forEach((key) => {
          const itemText = data[key].text;
          ul.innerHTML += `
            <li class="reminder-item">
              <span>${itemText}</span>
              <button onclick="removeReminder('${key}')">✕</button>
            </li>
          `;
        });
      }, (error) => {
        console.error("Firebase 讀取失敗:", error);
        document.getElementById('db-status').innerText = '🔴 請檢查 databaseURL 或權限';
      });

      window.addReminder = function() {
        const input = document.getElementById('rem-input');
        const val = input.value.trim();
        if (!val) return;
        remindersRef.push({ text: val, createdAt: Date.now() });
        input.value = '';
      };

      window.removeReminder = function(key) {
        remindersRef.child(key).remove();
      };
    } catch (e) {
      console.error("Firebase 初始化錯誤:", e);
    }

    function handleEnter(e) {
      if (e.key === 'Enter') window.addReminder();
    }
  </script>
</body>
</html>
