<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Home Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/es6-promise@4/dist/es6-promise.auto.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/whatwg-fetch@3.6.2/dist/fetch.umd.min.js"></script>
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').catch(function() {});
      });
    }
  </script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: #0f172a; color: #f8fafc; min-height: 100vh;
      padding: 1.2rem; overflow-x: hidden;
      -webkit-transition: -webkit-transform 1.5s ease; transition: transform 1.5s ease;
    }
    body > div { margin-bottom: 1.2rem; }
    body > div:last-of-type { margin-bottom: 0; }

    /* 夜間遮罩 */
    #night-overlay {
      position: fixed; top: 0; right: 0; bottom: 0; left: 0;
      background: rgba(0,0,0,0.82); z-index: 9999; pointer-events: none;
      opacity: 0; -webkit-transition: opacity 1.2s ease; transition: opacity 1.2s ease;
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-box-align: end; -webkit-align-items: flex-end; align-items: flex-end;
      -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
      padding-bottom: 1.2rem; margin-bottom: 0;
    }
    body.night-dimmed #night-overlay { opacity: 1; }
    .night-hint { color: rgba(255,255,255,0.35); font-size: 0.82rem; }

    /* 頂部欄 */
    .top-bar {
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
      -webkit-box-align: center; -webkit-align-items: center; align-items: center;
      background: #1e293b; padding: 1.2rem 1.5rem; border-radius: 1.2rem;
      -webkit-flex-wrap: wrap; flex-wrap: wrap;
    }
    .time-box h1 { font-size: 3rem; font-weight: 800; letter-spacing: -1px; }
    .time-subrow { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; margin-top: 0.25rem; -webkit-flex-wrap: wrap; flex-wrap: wrap; }
    .time-subrow p { font-size: 1.1rem; color: #94a3b8; margin-right: 0.6rem; }
    .btn-night-toggle { background: #0f172a; color: #94a3b8; border: 1px solid #334155; padding: 0.25rem 0.65rem; border-radius: 999px; font-size: 0.75rem; cursor: pointer; }
    .btn-night-toggle.active { color: #facc15; border-color: #eab308; }

    .weather-box { text-align: right; }
    .weather-temp { font-size: 2.6rem; font-weight: 700; color: #38bdf8; line-height: 1; }
    .weather-info { font-size: 0.92rem; color: #94a3b8; margin: 0.3rem 0; }
    .rain-tip { display: inline-block; padding: 0.3rem 0.75rem; border-radius: 999px; font-size: 0.82rem; font-weight: 600; background: #334155; color: #f8fafc; }
    .rain-tip.safe { background: rgba(34,197,94,0.2); color: #4ade80; border: 1px solid rgba(34,197,94,0.4); }
    .rain-tip.danger { background: rgba(239,68,68,0.25); color: #f87171; border: 1px solid rgba(239,68,68,0.5); }

    /* 全屋重要廣播 */
    .pinned-banner {
      display: none; background: rgba(234,179,8,0.18); border: 2px solid #eab308;
      border-radius: 1rem; padding: 0.85rem 1.2rem;
      -webkit-animation: bannerPulse 3s infinite ease-in-out; animation: bannerPulse 3s infinite ease-in-out;
    }
    .pinned-banner.active { display: block; }
    @-webkit-keyframes bannerPulse { 0%, 100% { border-color: #eab308; } 50% { border-color: #fde047; } }
    @keyframes bannerPulse { 0%, 100% { border-color: #eab308; } 50% { border-color: #fde047; } }
    .pinned-content { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; -webkit-flex-wrap: wrap; flex-wrap: wrap; }
    .pinned-tag { background: #eab308; color: #0f172a; font-weight: 800; font-size: 0.85rem; padding: 0.25rem 0.6rem; border-radius: 0.45rem; margin-right: 0.8rem; white-space: nowrap; }
    .pinned-text-list { font-size: 1.1rem; font-weight: 700; color: #fef08a; -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; min-width: 200px; }
    .pinned-row { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between; -webkit-box-align: center; -webkit-align-items: center; align-items: center; margin: 0.2rem 0; }
    .pinned-unpin-btn { background: rgba(15,23,42,0.7); border: 1px solid #facc15; color: #fde047; padding: 0.25rem 0.6rem; border-radius: 0.4rem; font-size: 0.78rem; cursor: pointer; margin-left: 0.6rem; white-space: nowrap; }

    /* 通用卡片與按鈕 */
    .card { background: #1e293b; border-radius: 1.2rem; padding: 1.2rem 1.4rem; width: 100%; min-width: 0; overflow: hidden; }
    .card h2 {
      font-size: 1.2rem; margin-bottom: 0.9rem; border-bottom: 1px solid #334155; padding-bottom: 0.55rem;
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
      -webkit-box-align: center; -webkit-align-items: center; align-items: center; -webkit-flex-wrap: wrap; flex-wrap: wrap;
    }
    .header-actions { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
    .last-update { font-size: 0.78rem; color: #94a3b8; font-weight: normal; margin-right: 0.6rem; }
    .btn-small { background: #334155; color: #f8fafc; border: none; padding: 0.4rem 0.75rem; border-radius: 0.5rem; font-size: 0.8rem; cursor: pointer; font-weight: 600; margin-left: 0.35rem; }
    .btn-small:first-child { margin-left: 0; }
    .btn-small.primary { background: #38bdf8; color: #0f172a; }
    .btn-small.accent { background: #0f172a; color: #38bdf8; border: 1px solid #38bdf8; }
    .btn-small.danger { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.4); }

    /* 首頁：群組選擇牆 (iOS 9 置中按鈕) */
    .groups-grid { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin: -0.5rem; }
    .group-card {
      background: #0f172a; border: 2px solid #334155; border-radius: 1.1rem;
      padding: 1.4rem 1rem; width: 165px; margin: 0.5rem;
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-box-orient: vertical; -webkit-box-direction: normal; -webkit-flex-direction: column; flex-direction: column;
      -webkit-box-align: center; -webkit-align-items: center; align-items: center;
      cursor: pointer; position: relative;
    }
    .group-avatar {
      width: 72px; height: 72px; border-radius: 50%; object-fit: cover;
      background: #1e293b; border: 2px solid #38bdf8;
      text-align: center; line-height: 68px; font-size: 2rem; margin-bottom: 0.6rem; display: block;
    }
    .group-name { font-size: 1.1rem; font-weight: 700; text-align: center; word-break: break-word; width: 100%; }
    .btn-edit-group-card, .btn-del-group {
      position: absolute; top: 0.5rem; width: 28px; height: 28px; border-radius: 50%;
      padding: 0; margin: 0; line-height: 26px; text-align: center; font-size: 0.85rem;
      cursor: pointer; display: block; -webkit-appearance: none;
    }
    .btn-edit-group-card { left: 0.5rem; background: rgba(56,189,248,0.18); border: 1px solid rgba(56,189,248,0.5); color: #38bdf8; }
    .btn-del-group { right: 0.5rem; background: rgba(239,68,68,0.18); border: 1px solid rgba(239,68,68,0.5); color: #ef4444; }

    /* 表單面板 */
    .add-group-panel, .add-bus-panel { display: none; background: #0f172a; border: 1px solid #334155; border-radius: 0.8rem; padding: 1rem; margin-bottom: 1rem; }
    .add-group-panel.active, .add-bus-panel.active { display: block; }
    .avatar-upload-row { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin: 0.6rem 0; }
    .avatar-preview { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: #1e293b; border: 2px dashed #38bdf8; text-align: center; line-height: 48px; font-size: 1.5rem; margin-right: 0.8rem; display: block; }
    .file-label { background: #334155; color: #f8fafc; padding: 0.45rem 0.85rem; border-radius: 0.5rem; font-size: 0.85rem; cursor: pointer; font-weight: 600; margin-right: 0.5rem; }
    .form-row { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin-top: 0.5rem; }
    .form-row input, .form-row select { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; min-width: 160px; padding: 0.55rem 0.75rem; border-radius: 0.5rem; border: 1px solid #334155; background: #1e293b; color: white; font-size: 0.92rem; margin-right: 0.5rem; }
    .form-row button { padding: 0.55rem 0.95rem; background: #38bdf8; color: #0f172a; border: none; border-radius: 0.5rem; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .status-msg { font-size: 0.85rem; color: #fbbf24; margin-top: 0.5rem; }

    /* 群組內部導覽與可調式佈局 */
    #group-view { display: none; }
    .group-nav-bar {
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
      -webkit-box-align: center; -webkit-align-items: center; align-items: center;
      background: #1e293b; padding: 0.8rem 1.2rem; border-radius: 1rem; border: 1px solid #334155;
      margin-bottom: 1.2rem; -webkit-flex-wrap: wrap; flex-wrap: wrap;
    }
    .current-group-badge { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; margin-bottom: 0.2rem; }
    .current-group-badge img, .current-group-badge .emoji-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #38bdf8; background: #0f172a; text-align: center; line-height: 36px; font-size: 1.2rem; margin-right: 0.65rem; display: block; }
    .current-group-title { font-size: 1.2rem; font-weight: 800; color: #38bdf8; }
    .nav-actions { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; -webkit-box-align: center; -webkit-align-items: center; align-items: center; }

    /* 主內容區：支援上下堆疊 (stacked) 與左右並排 (side) */
    .main-grid {
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-box-align: start; -webkit-align-items: flex-start; align-items: flex-start;
      width: 100%;
    }
    .main-grid.layout-stacked {
      -webkit-box-orient: vertical; -webkit-box-direction: normal; -webkit-flex-direction: column; flex-direction: column;
    }
    .main-grid.layout-stacked > .card { width: 100%; margin-right: 0; margin-bottom: 1.2rem; }
    .main-grid.layout-stacked > .card:last-child { margin-bottom: 0; }

    .main-grid.layout-side > .card { width: 49%; margin-right: 2%; margin-bottom: 0; }
    .main-grid.layout-side > .card:last-child { margin-right: 0; }

    @media (max-width: 768px) {
      .main-grid.layout-side { -webkit-box-orient: vertical; -webkit-box-direction: normal; -webkit-flex-direction: column; flex-direction: column; }
      .main-grid.layout-side > .card { width: 100%; margin-right: 0; margin-bottom: 1.2rem; }
      .main-grid.layout-side > .card:last-child { margin-bottom: 0; }
      .time-box h1 { font-size: 2.3rem; }
      .weather-temp { font-size: 2.1rem; }
      .weather-box { text-align: left; margin-top: 0.5rem; width: 100%; }
    }

    /* 巴士列表 */
    .bus-group { margin-bottom: 0.85rem; background: #0f172a; padding: 0.85rem 1rem; border-radius: 0.8rem; width: 100%; overflow: hidden; }
    .bus-group:last-child { margin-bottom: 0; }
    .bus-header {
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
      -webkit-box-align: start; -webkit-align-items: flex-start; align-items: flex-start;
      margin-bottom: 0.45rem; width: 100%;
    }
    .bus-title { font-size: 1.15rem; font-weight: bold; color: #fbbf24; -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; min-width: 0; padding-right: 0.5rem; word-break: break-word; }
    .bus-subtitle { font-size: 0.85rem; color: #94a3b8; font-weight: normal; margin-left: 0.35rem; }
    .btn-del-bus { background: transparent; border: 1px solid #ef4444; color: #ef4444; border-radius: 0.4rem; padding: 0.15rem 0.5rem; font-size: 0.75rem; cursor: pointer; white-space: nowrap; -webkit-flex-shrink: 0; flex-shrink: 0; }
    .eta-row {
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
      -webkit-box-align: center; -webkit-align-items: center; align-items: center;
      padding: 0.45rem 0; border-bottom: 1px dashed #334155; width: 100%;
    }
    .eta-row:last-child { border-bottom: none; padding-bottom: 0; }
    .eta-seq { color: #94a3b8; font-size: 0.9rem; -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; min-width: 0; padding-right: 0.5rem; }
    .eta-countdown { background: #334155; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.85rem; white-space: nowrap; -webkit-flex-shrink: 0; flex-shrink: 0; }
    .eta-urgent { background: #22c55e; color: black; font-weight: bold; }

    /* 備忘錄 */
    .reminder-input { display: -webkit-box; display: -webkit-flex; display: flex; margin-bottom: 0.85rem; width: 100%; }
    .reminder-input input { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; min-width: 0; padding: 0.55rem 0.75rem; border-radius: 0.5rem; border: 1px solid #334155; background: #0f172a; color: white; font-size: 0.92rem; margin-right: 0.4rem; }
    .reminder-input button { padding: 0.55rem 0.9rem; background: #38bdf8; color: #0f172a; border: none; border-radius: 0.5rem; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .reminder-list { list-style: none; }
    .reminder-item {
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
      -webkit-box-align: center; -webkit-align-items: center; align-items: center;
      background: #0f172a; padding: 0.6rem 0.8rem; border-radius: 0.5rem; margin-bottom: 0.45rem; width: 100%;
    }
    .reminder-text { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; min-width: 0; word-break: break-word; padding-right: 0.5rem; font-size: 0.95rem; }
    .rem-actions { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; -webkit-flex-shrink: 0; flex-shrink: 0; }
    .btn-pin { background: transparent; border: 1px solid #334155; color: #94a3b8; border-radius: 0.4rem; padding: 0.15rem 0.45rem; font-size: 0.8rem; cursor: pointer; margin-right: 0.3rem; white-space: nowrap; }
    .btn-del-rem { background: transparent; border: none; color: #ef4444; font-size: 1rem; cursor: pointer; padding: 0 0.3rem; }

    /* 底部 5 天預報 */
    .forecast-grid { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between; -webkit-flex-wrap: wrap; flex-wrap: wrap; }
    .forecast-day { width: 19%; min-width: 110px; background: #0f172a; border-radius: 0.8rem; padding: 0.75rem 0.5rem; text-align: center; margin-bottom: 0.5rem; }
    @media (max-width: 640px) { .forecast-day { width: 48%; } }
    .f-week { font-weight: 700; font-size: 0.92rem; }
    .f-date { font-size: 0.75rem; color: #94a3b8; margin: 0.15rem 0; }
    .f-icon { width: 40px; height: 40px; margin: 0.2rem auto; background: rgba(255,255,255,0.1); border-radius: 8px; padding: 4px; display: block; }
    .f-temp { font-weight: 700; font-size: 0.95rem; color: #38bdf8; }
    .f-psr { font-size: 0.75rem; color: #94a3b8; margin-top: 0.15rem; }
  </style>
</head>
<body>

  <div id="night-overlay">
    <div class="night-hint">🌙 夜間護眼與防烙印模式生效中（輕觸螢幕可暫時喚醒 60 秒）</div>
  </div>

  <div class="top-bar">
    <div class="time-box">
      <h1 id="clock">--:--:--</h1>
      <div class="time-subrow">
        <p id="date">載入中...</p>
        <button class="btn-night-toggle" id="night-mode-btn" onclick="toggleManualNightMode(event)">🌙 夜間調暗: 自動</button>
      </div>
    </div>
    <div class="weather-box">
      <div class="weather-temp" id="temp">--°C</div>
      <div class="weather-info" id="weather-desc">載入天氣中...</div>
      <div class="rain-tip" id="rain-tip">🌂 正在分析降雨預報...</div>
    </div>
  </div>

  <div class="pinned-banner" id="global-pinned-banner">
    <div class="pinned-content">
      <span class="pinned-tag">📢 全屋重要廣播</span>
      <div class="pinned-text-list" id="global-pinned-banner-list"></div>
    </div>
  </div>

  <!-- 畫面 A：首頁群組選擇 -->
  <div id="home-view">
    <div class="card">
      <h2>
        <span>👨‍👩‍👧‍👦 選擇家庭群組 / 成員面板</span>
        <button class="btn-small primary" onclick="openCreateGroupPanel()">＋ 新增群組</button>
      </h2>

      <div class="add-group-panel" id="add-group-panel">
        <div style="font-weight:bold; color:#38bdf8;" id="group-form-title">建立新家庭群組</div>
        <div class="avatar-upload-row">
          <div id="group-avatar-preview" class="avatar-preview">🏠</div>
          <label class="file-label">
            📷 上傳 / 更換圖片
            <input type="file" accept="image/*" style="display:none;" onchange="handleGroupIconUpload(event, 'home')">
          </label>
          <button class="btn-small danger" onclick="clearUploadedIcon('home')">重置預設 🏠</button>
        </div>
        <div class="form-row">
          <input type="text" id="group-name-input" placeholder="輸入群組名稱 (例如: 屋企大廳、返工專區)">
          <button onclick="saveGroupFromHome()" id="group-form-submit-btn" style="margin-right:0.4rem;">確認建立</button>
          <button class="btn-small" onclick="closeGroupPanel()">取消</button>
        </div>
      </div>

      <div class="groups-grid" id="groups-grid">
        <div style="color:#64748b; padding:0.5rem;">正在同步雲端群組...</div>
      </div>
    </div>
  </div>

  <!-- 畫面 B：群組專屬面板 -->
  <div id="group-view">
    <div class="group-nav-bar">
      <div class="current-group-badge">
        <div id="active-group-avatar" class="emoji-avatar">🏠</div>
        <div>
          <div style="font-size:0.75rem; color:#94a3b8;">目前顯示群組</div>
          <div class="current-group-title" id="active-group-name">--</div>
        </div>
      </div>
      <div class="nav-actions">
        <button class="btn-small accent" onclick="swapCardOrder()" id="btn-swap-order">🔄 備忘置頂</button>
        <button class="btn-small accent" onclick="toggleLayoutMode()" id="btn-layout-mode">↕️ 上下排列</button>
        <button class="btn-small primary" onclick="toggleInGroupEditPanel()">✎ 編輯群組</button>
        <button class="btn-small" onclick="backToHomeGroups()">⬅ 切換群組</button>
      </div>
    </div>

    <div class="add-group-panel" id="in-group-edit-panel">
      <div style="font-weight:bold; color:#38bdf8;">✎ 修改當前群組名稱與圖示</div>
      <div class="avatar-upload-row">
        <div id="in-group-avatar-preview" class="avatar-preview">🏠</div>
        <label class="file-label">
          📷 更換新圖片
          <input type="file" accept="image/*" style="display:none;" onchange="handleGroupIconUpload(event, 'ingroup')">
        </label>
        <button class="btn-small danger" onclick="clearUploadedIcon('ingroup')">重置預設 🏠</button>
      </div>
      <div class="form-row">
        <input type="text" id="in-group-name-input" placeholder="輸入新群組名稱">
        <button onclick="saveInGroupEdit()" style="margin-right:0.4rem;">儲存修改</button>
        <button class="btn-small" onclick="toggleInGroupEditPanel()">取消</button>
      </div>
    </div>

    <!-- 主內容區 (可自由上下對調或並排) -->
    <div class="main-grid layout-stacked" id="main-grid">
      <!-- 區塊 1：巴士預計到站 -->
      <div class="card" id="card-bus">
        <h2>

  <script>
    /* 0. 區塊次序與排版控制 (自動儲存於本機) */
    var cardOrder = 'bus-first'; // 'bus-first' 或 'rem-first'
    var layoutMode = 'stacked';  // 'stacked' (上下) 或 'side' (左右)
    try {
      cardOrder = localStorage.getItem('dashboard_card_order') || 'bus-first';
      layoutMode = localStorage.getItem('dashboard_layout_mode') || 'stacked';
    } catch (e) {}

    function applyLayoutPreferences() {
      var grid = document.getElementById('main-grid');
      var busCard = document.getElementById('card-bus');
      var remCard = document.getElementById('card-rem');
      var swapBtn = document.getElementById('btn-swap-order');
      var modeBtn = document.getElementById('btn-layout-mode');

      // 調整 DOM 先後次序 (100% 兼容 iOS 9 舊版 Safari)
      if (cardOrder === 'rem-first') {
        grid.insertBefore(remCard, busCard);
        swapBtn.innerText = '🔄 巴士置頂';
      } else {
        grid.insertBefore(busCard, remCard);
        swapBtn.innerText = '🔄 備忘置頂';
      }

      // 調整上下排列或左右並排
      if (layoutMode === 'side') {
        grid.className = 'main-grid layout-side';
        modeBtn.innerText = '↔️ 左右並排';
      } else {
        grid.className = 'main-grid layout-stacked';
        modeBtn.innerText = '↕️ 上下排列';
      }
    }

    function swapCardOrder() {
      cardOrder = (cardOrder === 'bus-first') ? 'rem-first' : 'bus-first';
      try { localStorage.setItem('dashboard_card_order', cardOrder); } catch (e) {}
      applyLayoutPreferences();
    }

    function toggleLayoutMode() {
      layoutMode = (layoutMode === 'stacked') ? 'side' : 'stacked';
      try { localStorage.setItem('dashboard_layout_mode', layoutMode); } catch (e) {}
      applyLayoutPreferences();
    }

    applyLayoutPreferences();

    /* 1. Firebase 初始化與全域狀態 */
    firebase.initializeApp({
      apiKey: "AIzaSyBUHonT_ucWcc3Ks4vprZTZV3ji80CVwD4",
      authDomain: "my-home-dashboard-5f8ee.firebaseapp.com",
      databaseURL: "https://my-home-dashboard-5f8ee-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "my-home-dashboard-5f8ee",
      storageBucket: "my-home-dashboard-5f8ee.firebasestorage.app",
      messagingSenderId: "508816607799",
      appId: "1:508816607799:web:c2d1c8f646f973cfd00db2"
    });

    var db = firebase.database();
    var groupsRef = db.ref('family_groups');
    var globalBroadcastsRef = db.ref('global_broadcasts');
    var DEFAULT_BUS_LIST = [
      { route: "297", dest: "景林邨 往 紅磡(紅鸞道)", stop_id: "22E2678081E88368", dir: "outbound", service_type: "1" },
      { route: "93A", dest: "景林邨 往 觀塘碼頭", stop_id: "22E2678081E88368", dir: "outbound", service_type: "1" }
    ];

    var allGroupsData = {}, currentGroupId = null, currentBusRef = null, currentRemRef = null;
    var BUS_TRACK_LIST = [], editingGroupId = null, uploadedIconBase64 = "";
    try { currentGroupId = localStorage.getItem('active_family_group_id') || null; } catch (e) {}

    /* 全域廣播監聽 */
    globalBroadcastsRef.on('value', function(snap) {
      var data = snap.val();
      var banner = document.getElementById('global-pinned-banner');
      var list = document.getElementById('global-pinned-banner-list');
      list.innerHTML = '';
      if (!data) { banner.className = 'pinned-banner'; return; }

      var keys = Object.keys(data);
      if (keys.length > 0) {
        banner.className = 'pinned-banner active';
        list.innerHTML = keys.map(function(k) {
          var item = data[k];
          return '<div class="pinned-row"><span>• [' + (item.groupName || '屋企') + '] ' + item.text + '</span>' +
                 '<button class="pinned-unpin-btn" onclick="removeGlobalBroadcast(\'' + k + '\')">收到 / 移除</button></div>';
        }).join('');
      } else {
        banner.className = 'pinned-banner';
      }
    });

    /* 家庭群組監聽 */
    groupsRef.on('value', function(snap) {
      var data = snap.val();
      if (!data) {
        var ref = groupsRef.push({ name: "屋企大廳 (景林邨)", icon: "", createdAt: Date.now() });
        DEFAULT_BUS_LIST.forEach(function(b) { ref.child('bus_list').push(b); });
        return;
      }
      allGroupsData = data;
      renderGroupsGrid();
      if (currentGroupId && allGroupsData[currentGroupId]) {
        updateActiveGroupHeader(allGroupsData[currentGroupId]);
      } else if (currentGroupId && !allGroupsData[currentGroupId]) {
        backToHomeGroups();
      }
    });

    function renderGroupsGrid() {
      var html = '';
      Object.keys(allGroupsData).forEach(function(gid) {
        var g = allGroupsData[gid];
        var avatar = g.icon ? '<img class="group-avatar" src="' + g.icon + '">' : '<div class="group-avatar">🏠</div>';
        html += '<div class="group-card" onclick="enterGroup(\'' + gid + '\')">' +
                '<button class="btn-edit-group-card" onclick="openEditGroupOnHome(event, \'' + gid + '\')">✎</button>' +
                '<button class="btn-del-group" onclick="deleteGroup(event, \'' + gid + '\')">✕</button>' +
                avatar + '<div class="group-name">' + g.name + '</div></div>';
      });
      document.getElementById('groups-grid').innerHTML = html;
    }

    function setPreviewElement(id, src) {
      document.getElementById(id).outerHTML = src
        ? '<img id="' + id + '" class="avatar-preview" src="' + src + '">'
        : '<div id="' + id + '" class="avatar-preview">🏠</div>';
    }

    function openCreateGroupPanel() {
      editingGroupId = null; uploadedIconBase64 = "";
      document.getElementById('group-form-title').innerText = '＋ 建立新家庭群組';
      document.getElementById('group-form-submit-btn').innerText = '確認建立';
      document.getElementById('group-name-input').value = '';
      setPreviewElement('group-avatar-preview', '');
      document.getElementById('add-group-panel').className = 'add-group-panel active';
    }

    function openEditGroupOnHome(e, gid) {
      if (e && e.stopPropagation) e.stopPropagation();
      var g = allGroupsData[gid];
      if (!g) return;
      editingGroupId = gid; uploadedIconBase64 = g.icon || "";
      document.getElementById('group-form-title').innerText = '✎ 編輯群組：' + g.name;
      document.getElementById('group-form-submit-btn').innerText = '儲存修改';
      document.getElementById('group-name-input').value = g.name;
      setPreviewElement('group-avatar-preview', uploadedIconBase64);
      document.getElementById('add-group-panel').className = 'add-group-panel active';
    }

    function closeGroupPanel() {
      editingGroupId = null;
      document.getElementById('add-group-panel').className = 'add-group-panel';
    }

    function clearUploadedIcon(mode) {
      uploadedIconBase64 = "";
      setPreviewElement(mode === 'home' ? 'group-avatar-preview' : 'in-group-avatar-preview', '');
    }

    function handleGroupIconUpload(e, mode) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas'), max = 160, w = img.width, h = img.height;
          if (w > h && w > max) { h = Math.round(h * max / w); w = max; }
          else if (h >= w && h > max) { w = Math.round(w * max / h); h = max; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          uploadedIconBase64 = canvas.toDataURL('image/jpeg', 0.8);
          setPreviewElement(mode === 'home' ? 'group-avatar-preview' : 'in-group-avatar-preview', uploadedIconBase64);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function saveGroupFromHome() {
      var name = document.getElementById('group-name-input').value.trim();
      if (!name) return;
      if (editingGroupId) groupsRef.child(editingGroupId).update({ name: name, icon: uploadedIconBase64 });
      else groupsRef.push({ name: name, icon: uploadedIconBase64 || "", createdAt: Date.now() });
      closeGroupPanel();
    }

    function toggleInGroupEditPanel() {
      var p = document.getElementById('in-group-edit-panel');
      if (p.className.indexOf('active') !== -1) { p.className = 'add-group-panel'; return; }
      var g = allGroupsData[currentGroupId];
      if (!g) return;
      uploadedIconBase64 = g.icon || "";
      document.getElementById('in-group-name-input').value = g.name;
      setPreviewElement('in-group-avatar-preview', uploadedIconBase64);
      p.className = 'add-group-panel active';
    }

    function saveInGroupEdit() {
      var name = document.getElementById('in-group-name-input').value.trim();
      if (!currentGroupId || !name) return;
      groupsRef.child(currentGroupId).update({ name: name, icon: uploadedIconBase64 });
      document.getElementById('in-group-edit-panel').className = 'add-group-panel';
    }

    function deleteGroup(e, gid) {
      if (e && e.stopPropagation) e.stopPropagation();
      if (confirm('確定要刪除「' + (allGroupsData[gid] ? allGroupsData[gid].name : '') + '」群組嗎？')) {
        groupsRef.child(gid).remove();
      }
    }

    function enterGroup(gid) {
      if (!allGroupsData[gid]) return;
      if (currentBusRef) currentBusRef.off();
      if (currentRemRef) currentRemRef.off();
      currentGroupId = gid;
      try { localStorage.setItem('active_family_group_id', gid); } catch (e) {}

      document.getElementById('home-view').style.display = 'none';
      document.getElementById('in-group-edit-panel').className = 'add-group-panel';
      document.getElementById('group-view').style.display = 'block';
      updateActiveGroupHeader(allGroupsData[gid]);

      currentBusRef = db.ref('family_groups/' + gid + '/bus_list');
      currentBusRef.on('value', function(snap) {
        var data = snap.val();
        if (!data) {
          BUS_TRACK_LIST = []; latestBusData = [];
          document.getElementById('bus-container').innerHTML = '<div style="color:#64748b;">暫無路線，請按右上角「＋ 新增路線」</div>';
          return;
        }
        BUS_TRACK_LIST = Object.keys(data).map(function(k) {
          var b = data[k];
          return { firebaseKey: k, route: b.route, dest: b.dest, stop_id: b.stop_id, dir: b.dir, service_type: b.service_type };
        });
        fetchBusETA();
      });

      currentRemRef = db.ref('family_groups/' + gid + '/reminders');
      currentRemRef.on('value', function(snap) {
        document.getElementById('db-status').innerText = '🟢 已同步';
        var data = snap.val(), ul = document.getElementById('rem-list');
        ul.innerHTML = '';
        if (!data) return;
        Object.keys(data).forEach(function(k) {
          var txt = (data[k].text || ''), esc = txt.replace(/'/g, "\\'");
          ul.innerHTML += '<li class="reminder-item"><span class="reminder-text">' + txt + '</span>' +
            '<div class="rem-actions"><button class="btn-pin" onclick="toggleGlobalBroadcast(\'' + k + '\', \'' + esc + '\')">📌 廣播</button>' +
            '<button class="btn-del-rem" onclick="removeReminder(\'' + k + '\')">✕</button></div></li>';
        });
      });
    }

    function updateActiveGroupHeader(g) {
      document.getElementById('active-group-name').innerText = g.name;
      document.getElementById('active-group-avatar').outerHTML = g.icon
        ? '<img id="active-group-avatar" src="' + g.icon + '">'
        : '<div id="active-group-avatar" class="emoji-avatar">🏠</div>';
    }

    function backToHomeGroups() {
      if (currentBusRef) currentBusRef.off();
      if (currentRemRef) currentRemRef.off();
      currentGroupId = null;
      try { localStorage.removeItem('active_family_group_id'); } catch (e) {}
      document.getElementById('group-view').style.display = 'none';
      document.getElementById('home-view').style.display = 'block';
    }

    groupsRef.once('value', function(s) {
      var v = s.val();
      if (currentGroupId && v && v[currentGroupId]) enterGroup(currentGroupId);
    });

    /* 2. 九巴路線搜尋與站點載入 */
    var allStopsCache = null;
    function toggleAddBusPanel() {
      var p = document.getElementById('add-bus-panel');
      p.className = p.className.indexOf('active') !== -1 ? 'add-bus-panel' : 'add-bus-panel active';
    }

    function searchRouteDirections() {
      var route = document.getElementById('route-input').value.trim().toUpperCase();
      var msg = document.getElementById('bus-search-msg');
      var dirRow = document.getElementById('dir-row'), stopRow = document.getElementById('stop-row'), sel = document.getElementById('dir-select');
      if (!route) return;
      msg.innerText = '正在搜尋 ' + route + ' 路線資料...';
      dirRow.style.display = 'none'; stopRow.style.display = 'none';

      fetch('https://data.etabus.gov.hk/v1/transport/kmb/route/')
        .then(function(r) { return r.json(); })
        .then(function(json) {
          var matches = (json.data || []).filter(function(x) { return x.route === route; });
          if (!matches.length) { msg.innerText = '❌ 搵唔到九巴路線「' + route + '」'; return; }
          sel.innerHTML = '<option value="">-- 請選擇行車方向 --</option>';
          matches.forEach(function(m) {
            var val = JSON.stringify({ route: m.route, bound: m.bound === 'O' ? 'outbound' : 'inbound', service_type: m.service_type, dest_tc: m.dest_tc });
            var note = m.service_type !== '1' ? ' (特別班次 ' + m.service_type + ')' : '';
            sel.innerHTML += '<option value=\'' + val + '\'>' + m.orig_tc + ' ➔ 往 ' + m.dest_tc + note + '</option>';
          });
          dirRow.style.display = 'flex'; msg.innerText = '請選擇行車方向：';
        }).catch(function() { msg.innerText = '搜尋失敗，請稍後再試。'; });
    }

    function loadRouteStops() {
      var dirVal = document.getElementById('dir-select').value;
      var stopRow = document.getElementById('stop-row'), sel = document.getElementById('stop-select'), msg = document.getElementById('bus-search-msg');
      if (!dirVal) { stopRow.style.display = 'none'; return; }
      var info = JSON.parse(dirVal);
      msg.innerText = '正在載入沿途巴士站...'; stopRow.style.display = 'none';

      var p = allStopsCache ? Promise.resolve() : fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop')
        .then(function(r) { return r.json(); })
        .then(function(j) {
          allStopsCache = {};
          (j.data || []).forEach(function(s) { allStopsCache[s.stop] = s.name_tc; });
        });

      p.then(function() {
        return fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/' + info.route + '/' + info.bound + '/' + info.service_type);
      }).then(function(r) { return r.json(); }).then(function(j) {
        var stops = j.data || [];
        if (!stops.length) { msg.innerText = '❌ 此方向暫無站點資料。'; return; }
        sel.innerHTML = '';
        stops.forEach(function(rs) {
          var name = (allStopsCache[rs.stop] || rs.stop).replace(/\s*\([A-Z0-9]+\)$/, '');
          var opt = JSON.stringify({ route: info.route, stop_id: rs.stop, stop_name: name, dest_tc: info.dest_tc, dir: info.bound, service_type: info.service_type });
          sel.innerHTML += '<option value=\'' + opt + '\'>' + rs.seq + '. ' + (allStopsCache[rs.stop] || rs.stop) + '</option>';
        });
        stopRow.style.display = 'flex'; msg.innerText = '請揀選上車巴士站，然後撳「確認加入」：';
      }).catch(function() { msg.innerText = '載入站點失敗，請重試。'; });
    }

    function confirmAddBus() {
      var v = document.getElementById('stop-select').value;
      if (!currentBusRef || !v) return;
      var d = JSON.parse(v);
      currentBusRef.push({ route: d.route, dest: d.stop_name + ' 往 ' + d.dest_tc, stop_id: d.stop_id, dir: d.dir, service_type: String(d.service_type) });
      document.getElementById('route-input').value = '';
      document.getElementById('dir-row').style.display = 'none';
      document.getElementById('stop-row').style.display = 'none';
      document.getElementById('bus-search-msg').innerText = '';
      document.getElementById('add-bus-panel').className = 'add-bus-panel';
    }

    function removeBusRoute(k) { if (currentBusRef) currentBusRef.child(k).remove(); }

    /* 3. 時鐘、23:30 夜間調暗、防烙印微移、04:30 自動重整 */
    var manualNightOverride = null, temporaryWakeUntil = 0;

    function applyNightModeState(now) {
      var btn = document.getElementById('night-mode-btn');
      var mins = now.getHours() * 60 + now.getMinutes();
      var autoNight = (mins >= 1410 || mins < 390);
      var shouldDim = manualNightOverride === true ? true : (manualNightOverride === false ? false : autoNight);

      btn.innerText = manualNightOverride === true ? '🌙 夜間調暗: 強制開啟'
                    : manualNightOverride === false ? '☀️ 夜間調暗: 強制關閉'
                    : '🌙 夜間調暗: 自動 (23:30-06:30)';
      btn.className = shouldDim ? 'btn-night-toggle active' : 'btn-night-toggle';
      document.body.className = (shouldDim && Date.now() >= temporaryWakeUntil) ? 'night-dimmed' : '';
    }

    function toggleManualNightMode(e) {
      if (e && e.stopPropagation) e.stopPropagation();
      manualNightOverride = manualNightOverride === null ? true : (manualNightOverride === true ? false : null);
      temporaryWakeUntil = 0;
      applyNightModeState(new Date());
    }

    document.addEventListener('click', function() {
      if (document.body.className === 'night-dimmed') {
        temporaryWakeUntil = Date.now() + 60000;
        document.body.className = '';
      }
    });

    function updateClock() {
      var now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('zh-HK', { hour12: true, hour: 'numeric', minute: '2-digit', second: '2-digit' });
      document.getElementById('date').innerText = now.toLocaleDateString('zh-HK', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
      applyNightModeState(now);
      if (now.getHours() === 4 && now.getMinutes() === 30 && now.getSeconds() === 5) window.location.reload();
    }
    setInterval(updateClock, 1000); updateClock();

    var shiftStep = 0, shiftOffsets = ['translate(0,0)', 'translate(2px,1px)', 'translate(-1px,2px)', 'translate(-2px,-1px)', 'translate(1px,-2px)'];
    setInterval(function() {
      shiftStep = (shiftStep + 1) % shiftOffsets.length;
      document.body.style.webkitTransform = shiftOffsets[shiftStep];
      document.body.style.transform = shiftOffsets[shiftStep];
    }, 600000);

    /* 4. 天文台天氣與 5 天預報 */
    function safeJson(url) { return fetch(url).then(function(r) { return r.json(); }).catch(function() { return {}; }); }

    function fetchWeather() {
      var t = Date.now(), base = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?lang=tc&t=' + t + '&dataType=';
      Promise.all([safeJson(base + 'rhrread'), safeJson(base + 'warnsum'), safeJson(base + 'swt')]).then(function(res) {
        var data = res[0] || {}, warn = res[1] || {}, swt = res[2] || {};
        if (data.temperature && data.temperature.data && data.temperature.data.length) {
          var st = data.temperature.data[0];
          for (var i = 0; i < data.temperature.data.length; i++) {
            if (data.temperature.data[i].place === '將軍澳') { st = data.temperature.data[i]; break; }
          }
          document.getElementById('temp').innerText = st.value + '°C';
        }
        var hum = (data.humidity && data.humidity.data && data.humidity.data[0]) ? data.humidity.data[0].value : '--';
        var rainMm = 0;
        if (data.rainfall && data.rainfall.data) {
          for (var j = 0; j < data.rainfall.data.length; j++) {
            var r = data.rainfall.data[j];
            if ((r.place === '西貢' || r.place === '將軍澳') && r.max > 0) { rainMm = r.max; break; }
          }
        }
        var wList = [];
        if (warn.WRAIN) wList.push('⚠️ ' + warn.WRAIN.name);
        if (warn.WTS) wList.push('⚡ 雷暴警告');
        if (warn.WTCSGNL) wList.push('🌀 ' + warn.WTCSGNL.name);
        if (warn.WFIRE) wList.push('🔥 火災危險');
        if (warn.WCOLD) wList.push('❄️ 寒冷天氣');
        if (warn.WHOT) wList.push('☀️ 酷熱天氣');
        var wBadge = wList.length ? '<span style="color:#ef4444; font-weight:bold; margin-left:0.4rem;">[' + wList.join(' ') + ']</span>' : '';

        document.getElementById('weather-desc').innerHTML = '將軍澳 | 濕度: ' + hum + '% | ' + (rainMm > 0 ? '🌧️ 實時雨量: ' + rainMm + 'mm' : '實時無雨') + ' ' + wBadge;

        var tip = document.getElementById('rain-tip');
        var swtTxt = (swt.swt || []).map(function(s) { return s.desc; }).join(' ');
        if (rainMm > 0 || warn.WRAIN) {
          tip.className = 'rain-tip danger'; tip.innerText = '☔ 將軍澳現正落雨 (' + rainMm + 'mm)，出門務必帶遮！';
        } else if (swtTxt.indexOf('雨') !== -1 || swtTxt.indexOf('雷暴') !== -1 || warn.WTS) {
          tip.className = 'rain-tip danger'; tip.innerText = '☔ 天文台雷達顯示附近有雨區或雷暴';
        } else {
          tip.className = 'rain-tip safe'; tip.innerText = '🟢 將軍澳目前無雨，可放心出門';
        }
      });
    }

    function fetch5DayForecast() {
      safeJson('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc&t=' + Date.now()).then(function(d) {
        if (!d.weatherForecast || !d.weatherForecast.length) return;
        if (d.generalSituation) document.getElementById('fnd-desc').innerText = d.generalSituation.split('。')[0] + '。';
        document.getElementById('forecast-grid').innerHTML = d.weatherForecast.slice(0, 5).map(function(day, idx) {
          var wk = idx === 0 ? '明日 (' + day.week.replace('星期', '週') + ')' : day.week;
          return '<div class="forecast-day"><div class="f-week">' + wk + '</div>' +
                 '<div class="f-date">' + day.forecastDate.slice(4,6) + '月' + day.forecastDate.slice(6,8) + '日</div>' +
                 '<img class="f-icon" src="https://www.hko.gov.hk/images/HKOWxIconOutline/pic' + day.ForecastIcon + '.png">' +
                 '<div class="f-temp">' + day.forecastMintemp.value + '° - ' + day.forecastMaxtemp.value + '°C</div>' +
                 '<div class="f-psr">' + (day.PSR ? '☔ 降雨機率: ' + day.PSR : '') + '</div></div>';
        }).join('');
      });
    }
    fetchWeather(); fetch5DayForecast();
    setInterval(fetchWeather, 300000); setInterval(fetch5DayForecast, 1800000);

    /* 5. 九巴實時到站時間 (每秒倒數) */
    var latestBusData = [];
    function fetchBusETA() {
      if (!currentGroupId || !BUS_TRACK_LIST.length) return;
      var temp = new Array(BUS_TRACK_LIST.length);
      var tasks = BUS_TRACK_LIST.map(function(item, idx) {
        var url = 'https://data.etabus.gov.hk/v1/transport/kmb/eta/' + item.stop_id + '/' + item.route + '/' + item.service_type + '?t=' + Date.now();
        return fetch(url).then(function(r) { return r.json(); }).then(function(j) {
          var code = item.dir === 'inbound' ? 'I' : 'O';
          var etas = (j.data || []).filter(function(e) { return e.eta && (!e.dir || e.dir === code); }).slice(0, 3);
          temp[idx] = { firebaseKey: item.firebaseKey, route: item.route, dest: item.dest, etas: etas, error: false };
        }).catch(function() {
          temp[idx] = { firebaseKey: item.firebaseKey, route: item.route, dest: item.dest, etas: [], error: true };
        });
      });
      Promise.all(tasks).then(function() {
        latestBusData = temp;
        document.getElementById('eta-updated').innerText = '同步: ' + new Date().toLocaleTimeString('zh-HK', { hour12: true });
        renderBusETA();
      });
    }

    function renderBusETA() {
      if (!currentGroupId || !latestBusData.length) return;
      var now = new Date(), html = '';
      latestBusData.forEach(function(item) {
        if (!item) return;
        html += '<div class="bus-group"><div class="bus-header"><div class="bus-title">' + item.route +
                '<span class="bus-subtitle">(' + item.dest + ')</span></div>' +
                '<button class="btn-del-bus" onclick="removeBusRoute(\'' + item.firebaseKey + '\')">刪除</button></div>';
        if (item.error) {
          html += '<div style="color:#ef4444; font-size:0.88rem;">連線失敗，重試中...</div>';
        } else if (!item.etas.length) {
          html += '<div style="color:#64748b; font-size:0.88rem;">未有實時班次 / 已過尾班車</div>';
        } else {
          item.etas.forEach(function(e, i) {
            var d = new Date(e.eta), sec = Math.floor((d - now) / 1000);
            var tStr = d.toLocaleTimeString('zh-HK', { hour: 'numeric', minute: '2-digit', hour12: true });
            var cd = '即將抵達 / 已到站', urgent = true;
            if (sec > 0) {
              var m = Math.floor(sec / 60), s = String(sec % 60);
              cd = m + '分 ' + (s.length < 2 ? '0' + s : s) + '秒';
              urgent = m < 5;
            }
            html += '<div class="eta-row"><span class="eta-seq">第 ' + (i + 1) + ' 班 (' + tStr + ')</span>' +
                    '<span class="eta-countdown ' + (urgent ? 'eta-urgent' : '') + '">' + cd + '</span></div>';
          });
        }
        html += '</div>';
      });
      document.getElementById('bus-container').innerHTML = html;
    }
    setInterval(fetchBusETA, 15000); setInterval(renderBusETA, 1000);

    /* 6. 備忘錄與全屋廣播 */
    window.addReminder = function() {
      var input = document.getElementById('rem-input'), val = input.value.trim();
      if (!currentRemRef || !val) return;
      currentRemRef.push({ text: val, createdAt: Date.now() });
      input.value = '';
    };
    window.toggleGlobalBroadcast = function(key, text) {
      if (!currentGroupId || !allGroupsData[currentGroupId]) return;
      globalBroadcastsRef.child(key).set({ text: text, groupName: allGroupsData[currentGroupId].name, createdAt: Date.now() });
    };
    window.removeGlobalBroadcast = function(key) { globalBroadcastsRef.child(key).remove(); };
    window.removeReminder = function(key) {
      if (currentRemRef) currentRemRef.child(key).remove();
      globalBroadcastsRef.child(key).remove();
    };
    function handleEnter(e) { if (e.key === 'Enter' || e.keyCode === 13) window.addReminder(); }
  </script>
</body>
</html>
