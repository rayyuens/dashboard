<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Home Dashboard</title>

<!-- PWA Manifest & Service Worker 註冊 -->
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then((reg) => console.log('Service Worker 註冊成功:', reg.scope))
          .catch((err) => console.log('Service Worker 註冊失敗:', err));
      });
    }
  </script>

  <!-- 引入 Firebase App & Realtime Database SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --badge-red: #ef4444;
      --badge-green: #22c55e;
      --badge-yellow: #eab308;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    /* 頂部欄：時鐘與即時天氣 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 1.2rem 1.8rem;
      border-radius: 1.2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .time-box h1 { font-size: 3.2rem; font-weight: 800; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
    .time-box p { font-size: 1.15rem; color: var(--text-muted); margin-top: 0.2rem; }
    
    .weather-box { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.35rem; }
    .weather-temp-row { display: flex; align-items: center; gap: 0.6rem; }
    .weather-temp { font-size: 2.8rem; font-weight: 700; color: var(--accent); line-height: 1; }
    .weather-info { font-size: 0.95rem; color: var(--text-muted); }

    /* 未來兩小時帶遮提示標籤 */
    .rain-tip {
      display: inline-block;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      background: #334155;
      color: var(--text);
    }
    .rain-tip.safe { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .rain-tip.warn { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.4); }
    .rain-tip.danger { background: rgba(239, 68, 68, 0.25); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.5); }

    /* 中間主區域：巴士 + 備忘 */
    .main-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 1.2rem;
      flex: 1;
    }
    @media (max-width: 768px) {
      .main-grid { grid-template-columns: 1fr; }
      .time-box h1 { font-size: 2.4rem; }
      .weather-temp { font-size: 2.2rem; }
      .weather-box { align-items: flex-start; text-align: left; }
    }

    .card {
      background: var(--card-bg);
      border-radius: 1.2rem;
      padding: 1.3rem 1.5rem;
      display: flex;
      flex-direction: column;
    }
    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 0.9rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.55rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .header-actions { display: flex; align-items: center; gap: 0.6rem; }
    .last-update { font-size: 0.8rem; color: var(--text-muted); font-weight: normal; }
    .btn-small {
      background: #334155;
      color: var(--text);
      border: none;
      padding: 0.35rem 0.7rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-small.primary { background: var(--accent); color: #0f172a; }

    /* 新增巴士路線面板 */
    .add-bus-panel {
      display: none;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.8rem;
      padding: 1rem;
      margin-bottom: 1rem;
      flex-direction: column;
      gap: 0.8rem;
    }
    .add-bus-panel.active { display: flex; }
    .form-row { display: flex; gap: 0.5rem; align-items: center; }
    .form-row input, .form-row select {
      flex: 1;
      padding: 0.6rem 0.8rem;
      border-radius: 0.5rem;
      border: 1px solid #334155;
      background: var(--card-bg);
      color: white;
      font-size: 0.95rem;
    }
    .form-row button {
      padding: 0.6rem 1rem;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 0.5rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    .status-msg { font-size: 0.85rem; color: #fbbf24; }

    /* 巴士列表 */
    .bus-group {
      margin-bottom: 1rem;
      background: #0f172a;
      padding: 0.9rem 1rem;
      border-radius: 0.8rem;
    }
    .bus-group:last-child { margin-bottom: 0; }
    .bus-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
    }
    .bus-title { font-size: 1.2rem; font-weight: bold; color: #fbbf24; }
    .bus-subtitle { font-size: 0.88rem; color: var(--text-muted); font-weight: normal; margin-left: 0.4rem; }
    .btn-del-bus {
      background: transparent;
      border: 1px solid var(--badge-red);
      color: var(--badge-red);
      border-radius: 0.4rem;
      padding: 0.15rem 0.5rem;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .eta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px dashed #334155;
      font-variant-numeric: tabular-nums;
    }
    .eta-row:last-child { border-bottom: none; padding-bottom: 0; }
    .eta-seq { color: var(--text-muted); font-size: 0.92rem; }
    .eta-countdown {
      background: #334155;
      padding: 0.22rem 0.65rem;
      border-radius: 999px;
      font-size: 0.88rem;
    }
    .eta-urgent { background: var(--badge-green); color: black; font-weight: bold; }

    /* 備忘錄 */
    .reminder-input { display: flex; gap: 0.5rem; margin-bottom: 0.9rem; }
    .reminder-input input {
      flex: 1;
      padding: 0.6rem 0.8rem;
      border-radius: 0.5rem;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 0.95rem;
    }
    .reminder-input button {
      padding: 0.6rem 1rem;
      background: var(--accent);
      border: none;
      border-radius: 0.5rem;
      font-weight: bold;
      cursor: pointer;
    }
    .reminder-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
    .reminder-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 0.65rem 0.85rem;
      border-radius: 0.5rem;
    }
    .reminder-item button {
      background: transparent;
      border: none;
      color: var(--badge-red);
      font-size: 1.05rem;
      cursor: pointer;
      padding: 0 0.4rem;
    }

    /* 底部：未來 5 天迷你天氣預報卡 */
    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.8rem;
    }
    @media (max-width: 640px) {
      .forecast-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .forecast-day {
      background: #0f172a;
      border-radius: 0.8rem;
      padding: 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.35rem;
    }
    .f-week { font-weight: 700; font-size: 0.95rem; color: var(--text); }
    .f-date { font-size: 0.78rem; color: var(--text-muted); }
    .f-icon { width: 42px; height: 42px; margin: 0.15rem 0; background: rgba(255,255,255,0.1); border-radius: 8px; padding: 4px; }
    .f-temp { font-weight: 700; font-size: 1rem; color: var(--accent); }
    .f-psr { font-size: 0.78rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <!-- 頂部：時鐘、日期、即時天氣與未來兩小時降雨提示 -->
  <div class="top-bar">
    <div class="time-box">
      <h1 id="clock">--:--:--</h1>
      <p id="date">載入中...</p>
    </div>
    <div class="weather-box">
      <div class="weather-temp-row">
        <div class="weather-temp" id="temp">--°C</div>
      </div>
      <div class="weather-info" id="weather-desc">載入天氣中...</div>
      <div class="rain-tip" id="rain-tip">🌂 正在分析降雨預報...</div>
    </div>
  </div>

  <!-- 中間：巴士到站 + 家居備忘 -->
  <div class="main-grid">
    <!-- 巴士實時到站時間 -->
    <div class="card">
      <h2>
        <span>🚌 巴士預計到站</span>
        <div class="header-actions">
          <span class="last-update" id="eta-updated">更新中...</span>
          <button class="btn-small primary" onclick="toggleAddBusPanel()">＋ 新增路線</button>
        </div>
      </h2>

      <!-- 互動式新增巴士面板 -->
      <div class="add-bus-panel" id="add-bus-panel">
        <div class="form-row">
          <input type="text" id="route-input" placeholder="輸入路線 (例如: 297, 93A, 98D)" style="text-transform:uppercase;">
          <button onclick="searchRouteDirections()">1. 搜尋方向</button>
        </div>

        <div class="form-row" id="dir-row" style="display:none;">
          <select id="dir-select" onchange="loadRouteStops()"></select>
        </div>

        <div class="form-row" id="stop-row" style="display:none;">
          <select id="stop-select"></select>
          <button onclick="confirmAddBus()">2. 確認加入</button>
        </div>

        <div class="status-msg" id="bus-search-msg"></div>
      </div>

      <div id="bus-container">載入中...</div>
    </div>

    <!-- 備忘錄 / Reminders -->
    <div class="card">
      <h2>
        <span>📝 家居雲端備忘</span>
        <span class="last-update" id="db-status">連線中...</span>
      </h2>
      <div class="reminder-input">
        <input type="text" id="rem-input" placeholder="新增備忘項目..." onkeypress="handleEnter(event)">
        <button onclick="addReminder()">新增</button>
      </div>
      <ul class="reminder-list" id="rem-list"></ul>
    </div>
  </div>

  <!-- 底部：未來 5 天天氣預報卡 -->
  <div class="card">
    <h2>
      <span>🌤️ 未來 5 天天氣預報</span>
      <span class="last-update" id="fnd-desc">香港天文台預報</span>
    </h2>
    <div class="forecast-grid" id="forecast-grid">
      <div style="color:#64748b; font-size:0.9rem;">載入預報中...</div>
    </div>
  </div>

  <script>
    /* ================= 1. 初始化 Firebase ================= */
    const firebaseConfig = {
      apiKey: "AIzaSyBUHonT_ucWcc3Ks4vprZTZV3ji80CVwD4",
      authDomain: "my-home-dashboard-5f8ee.firebaseapp.com",
      databaseURL: "https://my-home-dashboard-5f8ee-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "my-home-dashboard-5f8ee",
      storageBucket: "my-home-dashboard-5f8ee.firebasestorage.app",
      messagingSenderId: "508816607799",
      appId: "1:508816607799:web:c2d1c8f646f973cfd00db2"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const remindersRef = db.ref('reminders');
    const busListRef = db.ref('bus_list');

    const DEFAULT_BUS_LIST = [
      {
        route: "297",
        dest: "景林邨 往 紅磡(紅鸞道)",
        stop_id: "22E2678081E88368",
        dir: "outbound",
        service_type: "1"
      },
      {
        route: "93A",
        dest: "景林邨 往 觀塘碼頭",
        stop_id: "22E2678081E88368",
        dir: "outbound",
        service_type: "1"
      }
    ];

    let BUS_TRACK_LIST = [];

    busListRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) {
        DEFAULT_BUS_LIST.forEach(item => busListRef.push(item));
        return;
      }
      BUS_TRACK_LIST = Object.keys(data).map(key => ({
        firebaseKey: key,
        ...data[key]
      }));
      fetchBusETA();
    });

    /* ================= 2. 互動式搜尋九巴路線及站點 ================= */
    let allStopsCache = null;

    function toggleAddBusPanel() {
      const panel = document.getElementById('add-bus-panel');
      panel.classList.toggle('active');
    }

    async function searchRouteDirections() {
      const routeInput = document.getElementById('route-input').value.trim().toUpperCase();
      const msg = document.getElementById('bus-search-msg');
      const dirRow = document.getElementById('dir-row');
      const stopRow = document.getElementById('stop-row');
      const dirSelect = document.getElementById('dir-select');

      if (!routeInput) return;
      msg.innerText = `正在搜尋 ${routeInput} 路線資料...`;
      dirRow.style.display = 'none';
      stopRow.style.display = 'none';

      try {
        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route/`);
        const json = await res.json();
        const matches = (json.data || []).filter(r => r.route === routeInput);

        if (matches.length === 0) {
          msg.innerText = `❌ 搵唔到九巴路線「${routeInput}」，請確認號碼是否正確。`;
          return;
        }

        dirSelect.innerHTML = `<option value="">-- 請選擇行車方向 --</option>`;
        matches.forEach(m => {
          const boundText = m.bound === 'O' ? 'outbound' : 'inbound';
          const specialNote = m.service_type !== '1' ? ` (特別班次 ${m.service_type})` : '';
          const val = JSON.stringify({
            route: m.route,
            bound: boundText,
            service_type: m.service_type,
            orig_tc: m.orig_tc,
            dest_tc: m.dest_tc
          });
          dirSelect.innerHTML += `<option value='${val}'>${m.orig_tc} ➔ 往 ${m.dest_tc}${specialNote}</option>`;
        });

        dirRow.style.display = 'flex';
        msg.innerText = `請選擇行車方向：`;
      } catch (err) {
        msg.innerText = `搜尋失敗，請稍後再試。`;
      }
    }

    async function loadRouteStops() {
      const dirVal = document.getElementById('dir-select').value;
      const stopRow = document.getElementById('stop-row');
      const stopSelect = document.getElementById('stop-select');
      const msg = document.getElementById('bus-search-msg');

      if (!dirVal) {
        stopRow.style.display = 'none';
        return;
      }

      const info = JSON.parse(dirVal);
      msg.innerText = `正在載入 ${info.route} (往${info.dest_tc}) 沿途巴士站...`;
      stopRow.style.display = 'none';

      try {
        if (!allStopsCache) {
          const allStopsRes = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop');
          const allStopsJson = await allStopsRes.json();
          allStopsCache = {};
          (allStopsJson.data || []).forEach(s => {
            allStopsCache[s.stop] = s.name_tc;
          });
        }

        const url = `https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${info.route}/${info.bound}/${info.service_type}`;
        const res = await fetch(url);
        const json = await res.json();
        const routeStops = json.data || [];

        if (routeStops.length === 0) {
          msg.innerText = `❌ 此方向暫無站點資料。`;
          return;
        }

        stopSelect.innerHTML = '';
        routeStops.forEach(rs => {
          const stopName = allStopsCache[rs.stop] || rs.stop;
          const cleanName = stopName.replace(/\s*\([A-Z0-9]+\)$/, '');
          const optionData = JSON.stringify({
            route: info.route,
            stop_id: rs.stop,
            stop_name: cleanName,
            dest_tc: info.dest_tc,
            dir: info.bound,
            service_type: info.service_type
          });
          stopSelect.innerHTML += `<option value='${optionData}'>${rs.seq}. ${stopName}</option>`;
        });

        stopRow.style.display = 'flex';
        msg.innerText = `請揀選你上車嘅巴士站，然後撳「確認加入」：`;
      } catch (err) {
        console.error(err);
        msg.innerText = `載入站點失敗，請重試。`;
      }
    }

    function confirmAddBus() {
      const stopVal = document.getElementById('stop-select').value;
      if (!stopVal) return;

      const data = JSON.parse(stopVal);
      busListRef.push({
        route: data.route,
        dest: `${data.stop_name} 往 ${data.dest_tc}`,
        stop_id: data.stop_id,
        dir: data.dir,
        service_type: String(data.service_type)
      });

      document.getElementById('route-input').value = '';
      document.getElementById('dir-row').style.display = 'none';
      document.getElementById('stop-row').style.display = 'none';
      document.getElementById('bus-search-msg').innerText = '';
      document.getElementById('add-bus-panel').classList.remove('active');
    }

    function removeBusRoute(firebaseKey) {
      busListRef.child(firebaseKey).remove();
    }

    /* ================= 3. 時間與日期 (12 小時制) ================= */
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('zh-HK', {
        hour12: true,
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit'
      });

      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      document.getElementById('date').innerText = now.toLocaleDateString('zh-HK', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    /* ================= 4. 天文台即時天氣 + 未來兩小時帶遮建議 + 5天預報 ================= */
    async function fetchWeather() {
      try {
        const ts = Date.now();
        // 並行抓取：1.分區實時天氣(rhrread) 2.警告信號(warnsum) 3.本港短期預報(flw) 4.特別天氣提示(swt)
        const [rhrRes, warnRes, flwRes, swtRes] = await Promise.allSettled([
          fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc&t=${ts}`),
          fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc&t=${ts}`),
          fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=flw&lang=tc&t=${ts}`),
          fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=tc&t=${ts}`)
        ]);

        const data = rhrRes.status === 'fulfilled' ? await rhrRes.value.json() : {};
        const warnData = warnRes.status === 'fulfilled' ? await warnRes.value.json() : {};
        const flwData = flwRes.status === 'fulfilled' ? await flwRes.value.json() : {};
        const swtData = swtRes.status === 'fulfilled' ? await swtRes.value.json() : {};

        // A. 將軍澳實時氣溫與濕度
        if (data.temperature && data.temperature.data.length > 0) {
          const tkoStation = data.temperature.data.find(d => d.place === '將軍澳') || data.temperature.data[0];
          document.getElementById('temp').innerText = `${tkoStation.value}°C`;
        }
        const humidity = data.humidity && data.humidity.data.length > 0 ? data.humidity.data[0].value : '--';

        // B. 檢查將軍澳/西貢實時雨量
        let currentRainMm = 0;
        if (data.rainfall && data.rainfall.data) {
          const tkoRain = data.rainfall.data.find(r => r.place === '西貢' || r.place === '將軍澳');
          if (tkoRain && tkoRain.max > 0) {
            currentRainMm = tkoRain.max;
          }
        }
        const rainText = currentRainMm > 0 ? `🌧️ 實時雨量: ${currentRainMm}mm` : '實時無雨';

        // C. 天氣警告標籤
        let warningBadge = '';
        if (warnData && typeof warnData === 'object') {
          const warnings = [];
          if (warnData.WRAIN) warnings.push(`⚠️ ${warnData.WRAIN.name}`);
          if (warnData.WTS) warnings.push('⚡ 雷暴警告');
          if (warnData.WTCSGNL) warnings.push(`🌀 ${warnData.WTCSGNL.name}`);
          if (warnData.WFIRE) warnings.push(`🔥 火災危險`);
          if (warnData.WCOLD) warnings.push('❄️ 寒冷天氣');
          if (warnData.WHOT) warnings.push('☀️ 酷熱天氣');

          if (warnings.length > 0) {
            warningBadge = `<span style="color:#ef4444; font-weight:bold; margin-left:0.4rem;">[${warnings.join(' ')}]</span>`;
          }
        }

        document.getElementById('weather-desc').innerHTML = `將軍澳 | 濕度: ${humidity}% | ${rainText} ${warningBadge}`;

    // D. 計算「未來兩小時帶遮建議」標籤 (只憑實時雨量或真實警告觸發)
            const rainTipEl = document.getElementById('rain-tip');
            const swtList = (swtData.swt || []).map(s => s.desc).join(' ');

            if (currentRainMm > 0 || (warnData && warnData.WRAIN)) {
              rainTipEl.className = 'rain-tip danger';
              rainTipEl.innerText = `☔ 將軍澳現正落雨 (${currentRainMm}mm)，出門務必帶遮！`;
            } else if (swtList.includes('雨') || swtList.includes('雷暴') || (warnData && warnData.WTS)) {
              rainTipEl.className = 'rain-tip danger';
              rainTipEl.innerText = `☔ 天文台雷達顯示附近有雨區或雷暴`;
            } else {
              rainTipEl.className = 'rain-tip safe';
              rainTipEl.innerText = `🟢 將軍澳目前無雨，可放心出門`;
            }

          } catch (err) {
            console.error("即時天氣更新失敗:", err);
          }
        }

    // E. 抓取未來 5 天天氣預報 (dataType=fnd)
    async function fetch5DayForecast() {
      try {
        const res = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc&t=${Date.now()}`);
        const data = await res.json();
        const grid = document.getElementById('forecast-grid');

        if (!data.weatherForecast || data.weatherForecast.length === 0) return;

        // 顯示概況一句話
        if (data.generalSituation) {
          document.getElementById('fnd-desc').innerText = data.generalSituation.split('。')[0] + '。';
        }

        const next5Days = data.weatherForecast.slice(0, 5);
        let html = '';

        next5Days.forEach((day, idx) => {
          // 格式化日期 YYYYMMDD -> MM/DD
          const m = day.forecastDate.slice(4, 6);
          const d = day.forecastDate.slice(6, 8);
          const weekLabel = idx === 0 ? `明日 (${day.week.replace('星期', '週')})` : day.week;
          const iconUrl = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${day.ForecastIcon}.png`;
          const psrText = day.PSR ? `☔ 降雨機率: ${day.PSR}` : '';

          html += `
            <div class="forecast-day">
              <div class="f-week">${weekLabel}</div>
              <div class="f-date">${m}月${d}日</div>
              <img class="f-icon" src="${iconUrl}" alt="${day.forecastWeather}">
              <div class="f-temp">${day.forecastMintemp.value}° - ${day.forecastMaxtemp.value}°C</div>
              <div class="f-psr">${psrText}</div>
            </div>
          `;
        });

        grid.innerHTML = html;
      } catch (err) {
        console.error("5天預報更新失敗:", err);
      }
    }

    fetchWeather();
    fetch5DayForecast();
    setInterval(fetchWeather, 5 * 60 * 1000);        // 每 5 分鐘更新即時天氣與降雨提示
    setInterval(fetch5DayForecast, 30 * 60 * 1000);  // 每 30 分鐘更新未來 5 天預報

    /* ================= 5. 九巴實時到站時間 (每秒即時倒數版) ================= */
    let latestBusData = [];

    async function fetchBusETA() {
      if (BUS_TRACK_LIST.length === 0) {
        document.getElementById('bus-container').innerHTML = '<div style="color:#64748b;">暫無監察路線，請按右上角「＋ 新增路線」</div>';
        return;
      }

      const tempResults = [];

      for (const item of BUS_TRACK_LIST) {
        try {
          const url = `https://data.etabus.gov.hk/v1/transport/kmb/eta/${item.stop_id}/${item.route}/${item.service_type}?t=${Date.now()}`;
          const res = await fetch(url, { cache: "no-store" });
          const json = await res.json();

          const expectedDirCode = item.dir === 'inbound' ? 'I' : 'O';
          const etas = (json.data || [])
            .filter(e => e.eta && (!e.dir || e.dir === expectedDirCode))
            .slice(0, 3);

          tempResults.push({ ...item, etas: etas, error: false });
        } catch (err) {
          console.error(`獲取 ${item.route} 失敗:`, err);
          tempResults.push({ ...item, etas: [], error: true });
        }
      }

      latestBusData = tempResults;
      document.getElementById('eta-updated').innerText = `同步: ${new Date().toLocaleTimeString('zh-HK', { hour12: true })}`;
      renderBusETA();
    }

    function renderBusETA() {
      const container = document.getElementById('bus-container');
      if (latestBusData.length === 0) return;

      const now = new Date();
      let html = '';

      for (const item of latestBusData) {
        html += `
          <div class="bus-group">
            <div class="bus-header">
              <div class="bus-title">
                ${item.route}
                <span class="bus-subtitle">(${item.dest})</span>
              </div>
              <button class="btn-del-bus" onclick="removeBusRoute('${item.firebaseKey}')">刪除</button>
            </div>
        `;

        if (item.error) {
          html += `<div style="color:#ef4444; font-size:0.9rem;">連線失敗，重試中...</div>`;
        } else if (item.etas.length === 0) {
          html += `<div style="color:#64748b; font-size:0.9rem;">未有實時班次 / 已過尾班車</div>`;
        } else {
          item.etas.forEach((e, idx) => {
            const etaDate = new Date(e.eta);
            const diffSec = Math.floor((etaDate - now) / 1000);
            const etaTimeStr = etaDate.toLocaleTimeString('zh-HK', { hour: 'numeric', minute: '2-digit', hour12: true });
            let countdownText = '';
            let isUrgent = false;

            if (diffSec <= 0) {
              countdownText = '即將抵達 / 已到站';
              isUrgent = true;
            } else {
              const mins = Math.floor(diffSec / 60);
              const secs = String(diffSec % 60).padStart(2, '0');
              countdownText = `${mins}分 ${secs}秒`;
              if (mins < 5) isUrgent = true;
            }

            html += `
              <div class="eta-row">
                <span class="eta-seq">第 ${idx + 1} 班 (${etaTimeStr})</span>
                <span class="eta-countdown ${isUrgent ? 'eta-urgent' : ''}">
                  ${countdownText}
                </span>
              </div>
            `;
          });
        }
        html += `</div>`;
      }

      container.innerHTML = html;
    }

    setInterval(fetchBusETA, 15 * 1000); // 每 15 秒向九巴攞一次新資料
    setInterval(renderBusETA, 1000);     // 每 1 秒更新畫面倒數

    /* ================= 6. 家居備忘 (Firebase 即時雲端同步) ================= */
    remindersRef.on('value', (snapshot) => {
      document.getElementById('db-status').innerText = '🟢 已同步';
      const data = snapshot.val();
      const ul = document.getElementById('rem-list');
      ul.innerHTML = '';

      if (!data) return;

      Object.keys(data).forEach((key) => {
        const itemText = data[key].text;
        ul.innerHTML += `
          <li class="reminder-item">
            <span>${itemText}</span>
            <button onclick="removeReminder('${key}')">✕</button>
          </li>
        `;
      });
    }, (error) => {
      console.error("Firebase 讀取失敗:", error);
      document.getElementById('db-status').innerText = '🔴 權限或網址錯誤';
    });

    window.addReminder = function() {
      const input = document.getElementById('rem-input');
      const val = input.value.trim();
      if (!val) return;
      remindersRef.push({ text: val, createdAt: Date.now() });
      input.value = '';
    };

    window.removeReminder = function(key) {
      remindersRef.child(key).remove();
    };

    function handleEnter(e) {
      if (e.key === 'Enter') window.addReminder();
    }
  </script>
</body>
</html>
